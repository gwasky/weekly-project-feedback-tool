[project]
name = "weekly-project-feedback-tool"
version = "0.1.0"
description = "Collect weekly project updates, draft an AI summary, and publish it after lead approval."
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
